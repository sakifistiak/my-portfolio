name: Keep Render App Awake

on:
  schedule:
    # Runs every 12 minutes to prevent Render free-tier from sleeping (15-minute threshold)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-service:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Website
        env:
          TARGET_URL: ${{ secrets.RENDER_SITE_URL || vars.RENDER_SITE_URL }}
        run: |
          URL="${TARGET_URL:-https://sakif.pro.bd}"
          echo "Pinging ${URL}/api/health at $(date -u)"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 "${URL}/api/health" || echo "failed")
          echo "Response code: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" = "200" ]; then
            echo "Successfully pinged! Service is awake."
          else
            echo "Ping returned ${HTTP_STATUS}, retrying root URL..."
            curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 "${URL}" || true
          fi
